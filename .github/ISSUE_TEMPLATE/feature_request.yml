name: Capability proposal
description: Propose an IC-loop improvement or a measured checking capability.
title: "capability: "
labels: [enhancement]
body:
  - type: textarea
    id: gap
    attributes:
      label: Product or measured gap
      description: What fails in the IC loop, or what can Groundnut not yet represent or decide?
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Frozen fixture or evidence
      description: Name the public/synthetic case that demonstrates the gap.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance condition
      description: State the deterministic test or preregistered measurement that would close the gap.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary check
      options:
        - label: This does not silently replace a metric, gate, policy, or protected holdout.
          required: true
        - label: The proposal names whether it changes the IC product path, canonical core, an experiment, or legacy compatibility.
          required: true
