[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "groundnut-evidence"
version = "0.1.0a11"
description = "Source-bound evidence integrity and replay contracts"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Andy"}]
dependencies = [
  "certifi",
  "pypdf==6.15.0",
]

[project.scripts]
groundnut = "groundnut.canonical_cli:main"
groundnut-ic = "groundnut.ic_loop:main"
groundnut-ledger = "groundnut.ledger_cli:main"
groundnut-arena = "groundnut.arena_cli:main"
groundnut-render = "groundnut.render_cli:main"
groundnut-equivalence = "groundnut.equivalence:main"
groundnut-capture = "groundnut.capture:main"

[tool.setuptools.packages.find]
include = ["groundnut*", "pipeline*"]

[tool.setuptools.package-data]
groundnut = ["data/**/*.json"]
